services:
  # ── 인프라 ──
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  localstack:
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts:/etc/localstack/init/ready.d

  livekit:
    image: livekit/livekit-server
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"

  # ── 애플리케이션 ──
  web:
    # profiles : 지정한 명령어를 받을때만 해당 컨테이너 실행
    profiles:
      - full
    build:
      context: ./WEB
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./WEB:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    build:
      context: ./SERVER
    ports:
      - "8080:8080"
      - "7092:7092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY}
      SPRING_CLOUD_AWS_S3_BUCKET: ${SPRING_CLOUD_AWS_S3_BUCKET}
      SPRING_CLOUD_AWS_S3_REGION: ${SPRING_CLOUD_AWS_S3_REGION}
      SPRING_CLOUD_AWS_ENDPOINT: ${SPRING_CLOUD_AWS_ENDPOINT:-}
      LIVEKIT_API_KEY: ${LIVEKIT_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_SECRET}
      INFERENCE_SERVER_URL: http://inference:8000
      CRDT_SERVER_URL: http://crdt:8899
      WORKSPACE_INVITE_URL: ${WORKSPACE_INVITE_URL:-http://localhost:5173/invite}
      INTERNAL_AUTH_API_KEY: ${INTERNAL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      - postgres
      - redis
      - localstack

  crdt:
    build:
      context: ./CRDT
    ports:
      - "8898:8898"
      - "8899:8899"
    environment:
      PORT: 8898
      SPRING_BASE_URL: http://server:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      - server

  inference:
    build:
      context: ./INFERENCE
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      CRDT_SERVER_URL: http://crdt:8899
      CRDT_SERVER_PATH: /internal
      CRDT_PORTFOLIO_PATH: /internal/ai/portfolio/messages
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
    depends_on:
      - postgres
      - qdrant

volumes:
  postgres_data:
  qdrant_data:
  localstack_data:
